<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Music Meets Europe 2027</title>
<meta name="description" content="Music Meets Europe 2027. Music connecting generations and cultures."/>
<!--
  Layout only. Dates, cities, venues, pictures, contact, and the main sentences
  live in data/programme.js. See README.md (English and 中文).
  Do not rename this file: GitHub Pages serves it, and Wix embeds it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #fff;
  color: #141414;
  font-family: "Manrope", Arial, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, video { max-width: 100%; }
a { color: inherit; }
:root { --red: #de1b23; --ink: #141414; }
.wrap { width: min(1180px, calc(100% - 8vw)); margin: 0 auto; }

.site-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1.5rem 2rem; flex-wrap: wrap;
  padding: 1.05rem 4vw;
  background: #fff;
  position: sticky; top: 0; z-index: 20;
  border-bottom: 1px solid #f2f2f2;
}
.brand {
  color: var(--red); text-decoration: none;
  font-weight: 600; font-size: 1.05rem; letter-spacing: -0.03em;
  display: flex; align-items: center; line-height: 0;
}
.brand img { height: 58px; width: auto; display: block; }
.nav-list { display: flex; flex-wrap: wrap; gap: .35rem 1.35rem; list-style: none; }
.nav-list a {
  color: var(--red); text-decoration: none; font-weight: 500; font-size: .95rem;
}
.nav-list a:hover { text-decoration: underline; }

.hero {
  position: relative; min-height: 78vh;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end;
  color: #fff; background: #1c1c1c; overflow: hidden;
}
section[id] { scroll-margin-top: 4.6rem; }
.hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; }
.hero-shade {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.38) 26%, rgba(0,0,0,.08) 52%, rgba(0,0,0,.18) 100%);
}
.hero-copy { position: relative; z-index: 1; padding: 4.5rem 6vw 1.2rem; }
.hero-kicker {
  font-size: .78rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; margin-bottom: .85rem; max-width: 40rem;
}
.hero h1 {
  font-weight: 300; font-size: clamp(3rem, 6.4vw, 5.4rem);
  line-height: .98; letter-spacing: -0.035em; max-width: 8.5em;
}
.hero h1 em, .feature h2 em, .section h2 em, .teaser h3 em { font-style: italic; padding-right: .12em; }
.hero-credit {
  position: relative; z-index: 1; align-self: flex-end;
  margin: 0 1.2rem .85rem 6vw; max-width: 26rem; text-align: right;
  font-size: .68rem; line-height: 1.4; color: rgba(255,255,255,.88);
}
.hero-credit a { color: #fff; }

.intro { padding: 4.8rem 6vw 1.5rem; text-align: center; }
.intro-lead {
  max-width: 16em; margin: 0 auto;
  color: var(--red); font-weight: 300;
  font-size: clamp(1.7rem, 3.3vw, 2.65rem);
  line-height: 1.28; letter-spacing: -0.02em;
}
.facts-line {
  margin-top: 1.8rem;
  color: var(--red); font-weight: 600; font-size: 1.05rem;
  letter-spacing: .14em; text-transform: uppercase;
}

.feature {
  width: min(1180px, calc(100% - 8vw));
  margin: 3.2rem auto;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 3.2rem 3.6rem; align-items: center;
}
.feature-reverse .feature-media { order: 2; }
.feature-media img, .feature-media video { width: 100%; height: auto; display: block; }
.about-video { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; display: block; }
.eyebrow {
  color: var(--red); font-size: .72rem; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; margin-bottom: .55rem;
}
.feature h2, .section h2 {
  color: var(--red); font-weight: 400;
  font-size: clamp(1.85rem, 3vw, 2.7rem);
  line-height: 1.12; letter-spacing: -0.03em; margin-bottom: .8rem;
}
.feature h2 em, .section h2 em, .teaser h3 em { font-weight: 400; }
.feature-copy p { color: var(--red); font-size: 1.08rem; line-height: 1.5; margin-bottom: .85rem; }
.feature-copy .caption { color: #4a4a4a; font-size: .98rem; }

.section { padding: 2.2rem 0 1rem; }
.section .eyebrow { margin-top: .4rem; }
.card-grid { display: grid; gap: 2.4rem 1.5rem; margin-top: 1.6rem; }
.cards-2 { grid-template-columns: 1fr 1fr; }
.cards-3 { grid-template-columns: 1fr 1fr 1fr; }
.teaser img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #f3f3f3; }
.teaser-kicker, .teaser-meta { color: var(--red); font-size: .8rem; font-weight: 600; margin-top: .75rem; }
.teaser h3,
.place-names,
.place-names em,
.teaser-points li,
.programme-list li {
  font-size: 1.05rem; font-weight: 600; font-style: normal;
  letter-spacing: 0; line-height: 1.4;
}
.teaser h3 {
  color: var(--red);
  margin: .2rem 0 .35rem;
}
.teaser-text { color: var(--red); font-size: .95rem; line-height: 1.45; }
.teaser-points { list-style: none; margin-top: .55rem; }
.teaser-points li { color: #333; margin-top: .2rem; }
.teaser-photos { display: block; }
.teaser-photos img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #f3f3f3; }
.more {
  display: inline-block; margin-top: .75rem;
  color: var(--red); font-weight: 700; font-size: .92rem; text-decoration: none;
}
.more:hover { text-decoration: underline; }
.credit {
  margin-top: .65rem; color: #666; font-size: .7rem; line-height: 1.4;
}
.credit a { color: #555; }

.pending { margin-top: 3rem; }
.pending h3 {
  color: var(--red); font-weight: 500; font-size: 1.45rem;
  letter-spacing: -0.02em; margin-bottom: 1rem;
}
.pending-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 2rem; }
.pending article h4 { color: var(--red); font-size: 1.05rem; font-weight: 600; }
.pending .teaser-meta { margin-top: .2rem; }
.pending p { color: #333; margin-top: .4rem; }

.programme { padding: 4.2rem 0 2.5rem; }
.programme h2 {
  color: var(--red);
  font-size: clamp(2.8rem, 5.4vw, 4.4rem);
  font-weight: 400; letter-spacing: -0.035em; line-height: 1.02;
  margin-bottom: .6rem;
}
.programme-lead { color: #333; font-size: 1.12rem; max-width: 40rem; margin-bottom: .4rem; }
.programme-poster {
  width: 100%;
  max-width: 760px;
  margin: 1.6rem auto 0;
}
.programme-poster img { width: 100%; height: auto; display: block; }

.contact { padding-bottom: 4rem; }
.contact-lead { color: #333; max-width: 36rem; margin-bottom: .4rem; }
.contact-email { margin: .2rem 0 1.6rem; }
.contact-email a {
  color: var(--red); font-weight: 600; font-size: 1.15rem; text-decoration: none;
}
.contact-email a:hover { text-decoration: underline; }
.contact-form { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1rem; max-width: 720px; }
.form-full { grid-column: 1 / -1; }
.contact-form label {
  display: block; margin-bottom: .3rem;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #666;
}
.contact-form input, .contact-form textarea {
  width: 100%; border: 1px solid #e3e3e3; background: #fff; color: var(--ink);
  font: inherit; padding: .75rem .85rem;
}
.contact-form input:focus, .contact-form textarea:focus { outline: 2px solid rgba(222,27,35,.25); border-color: var(--red); }
.contact-form textarea { min-height: 120px; resize: vertical; }
.btn {
  background: var(--red); color: #fff; border: 0; cursor: pointer;
  font: inherit; font-weight: 600; padding: .85rem 1.6rem;
}
.btn:hover { background: #c4161d; }

.site-footer { background: var(--red); color: #fff; padding: 3rem 4vw 2rem; }
.footer-brand { font-weight: 600; font-size: 1.15rem; letter-spacing: -0.02em; margin-bottom: 1rem; }
.footer-links { display: flex; flex-wrap: wrap; gap: .45rem 1.3rem; list-style: none; margin-bottom: 1.2rem; }
.footer-links a { color: #fff; text-decoration: none; font-weight: 500; }
.footer-links a:hover { text-decoration: underline; }
.site-footer p { font-size: .85rem; opacity: .95; }
.footer-copy { margin-top: 1.4rem; font-size: .78rem; opacity: .85; }

.load-error {
  max-width: 40rem; margin: 3rem auto; padding: 1.2rem;
  border: 1px solid var(--red); color: var(--red); text-align: center;
}

@media (max-width: 900px) {
  .cards-3 { grid-template-columns: 1fr 1fr; }
  .feature { gap: 1.6rem; }
}
@media (max-width: 700px) {
  .cards-2, .cards-3, .pending-grid, .contact-form { grid-template-columns: 1fr; }
  .feature { grid-template-columns: 1fr; margin: 2.2rem auto; }
  .feature-reverse .feature-media { order: -1; }
  .hero { min-height: 68vh; }
  .hero-copy { padding: 2.6rem 6vw .6rem; }
  .hero h1 { max-width: 7.2em; }
  .intro { padding-top: 2.8rem; }
  .programme h2 { font-size: clamp(2.2rem, 8vw, 3rem); }
  .site-header { padding: .75rem 5vw; }
  .brand img { height: 44px; }
  .hero-credit { align-self: stretch; text-align: left; margin: 0; padding: 0 6vw .9rem; max-width: none; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" id="brand" href="#top"></a>
  <nav aria-label="Page">
    <ul class="nav-list" id="nav"></ul>
  </nav>
</header>

<section class="hero" id="top">
  <img class="hero-image" id="hero-image" alt=""/>
  <div class="hero-shade" aria-hidden="true"></div>
  <div class="hero-copy">
    <p class="hero-kicker" id="hero-eyebrow"></p>
    <h1 id="hero-title"></h1>
  </div>
  <p class="hero-credit" id="hero-credit"></p>
</section>

<section class="intro" aria-labelledby="intro-lead">
  <p class="intro-lead" id="intro-lead"></p>
  <p class="facts-line" id="facts"></p>
</section>

<section class="feature" id="about">
  <div class="feature-media" id="about-media"></div>
  <div class="feature-copy">
    <p class="eyebrow" id="about-label"></p>
    <h2 id="about-title"></h2>
    <div id="about-paragraphs"></div>
  </div>
</section>

<section class="section" id="routes">
  <div class="wrap">
    <p class="eyebrow" id="sessions-eyebrow"></p>
    <h2 id="sessions-title"></h2>
    <div class="card-grid cards-2" id="sessions-grid"></div>
  </div>
</section>

<section class="section" id="events">
  <div class="wrap">
    <p class="eyebrow" id="events-eyebrow"></p>
    <h2 id="events-title"></h2>
    <div class="card-grid cards-3" id="events-grid"></div>
    <div class="pending" id="pending-block" hidden></div>
  </div>
</section>

<section class="programme" id="poster">
  <div class="wrap">
    <p class="eyebrow" id="poster-eyebrow"></p>
    <h2 id="poster-title"></h2>
  </div>
  <div class="programme-poster" id="poster-media"></div>
</section>

<section class="section contact" id="contact">
  <div class="wrap">
    <h2 id="contact-title"></h2>
    <p class="contact-lead" id="contact-sub"></p>
    <p class="contact-email" id="contact-email"></p>
    <form class="contact-form" id="contact-form">
      <div><label for="first-name">First name</label><input id="first-name" name="first" type="text" autocomplete="given-name" placeholder="Your first name"/></div>
      <div><label for="last-name">Last name</label><input id="last-name" name="last" type="text" autocomplete="family-name" placeholder="Your last name"/></div>
      <div><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" placeholder="your@email.com" required/></div>
      <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+00 000 000 0000"/></div>
      <div class="form-full"><label for="message">Message *</label><textarea id="message" name="message" required></textarea></div>
      <div class="form-full"><button class="btn" id="contact-submit" type="submit">Send message</button></div>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-brand" id="footer-logo"></div>
  <ul class="footer-links" id="footer-links"></ul>
  <p id="footer-mail"></p>
  <p class="footer-copy" id="footer-copy"></p>
</footer>

<noscript>
  <p class="load-error">This page reads its programme from data/programme.js and needs JavaScript to draw it.</p>
</noscript>

<script src="data/programme.js" id="programme-data" onerror="window.MME_DATA_FAILED=true"></script>
<script>
(function () {
  var PAGES = "https://uniartandreaszhang.github.io/musicmeeteurope/";

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function rich(value) {
    return escapeHtml(value).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
  }

  function asset(path) {
    if (!path) return "";
    if (/^(https?:|data:|blob:|mailto:)/i.test(path)) return path;
    var base = window.MME_ASSET_BASE || "";
    return base + String(path).split("/").map(function (part) {
      return encodeURIComponent(part);
    }).join("/");
  }

  function enquiryHref(programme, label) {
    var subject = programme.festival + " " + programme.year + " — " + (label || "Enquiry");
    return "mailto:" + programme.contactEmail + "?subject=" + encodeURIComponent(subject);
  }

  function creditFor(path, programme) {
    var list = programme.events || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].image && list[i].image === path && list[i].credit) return list[i].credit;
    }
    if (programme.hero && programme.hero.image === path && programme.hero.credit) return programme.hero.credit;
    return null;
  }

  function creditHtml(credit) {
    if (!credit || !credit.author) return "";
    function link(url, text) {
      if (!text) return "";
      if (!url) return escapeHtml(text);
      return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(text) + "</a>";
    }
    return '<p class="credit">Photo: ' + link(credit.authorUrl, credit.author) +
      (credit.licence ? ", " + link(credit.licenceUrl, credit.licence) : "") +
      (credit.sourceUrl ? ", " + link(credit.sourceUrl, credit.sourceName || "Source") : "") +
      "</p>";
  }

  function showError(message) {
    var node = document.createElement("p");
    node.className = "load-error";
    node.textContent = message;
    document.body.insertBefore(node, document.body.firstChild);
  }

  window.MME_buildMailto = function (form) {
    var programme = window.MME_PROGRAMME || {};
    var data = new FormData(form);
    var body = [
      "First name: " + (data.get("first") || ""),
      "Last name: " + (data.get("last") || ""),
      "Email: " + (data.get("email") || ""),
      "Phone: " + (data.get("phone") || ""),
      "",
      String(data.get("message") || ""),
    ].join("\n");
    var subject = (programme.festival || "Music Meets Europe") + " " + (programme.year || "") + " — Enquiry";
    return "mailto:" + (programme.contactEmail || "") +
      "?subject=" + encodeURIComponent(subject.trim()) +
      "&body=" + encodeURIComponent(body);
  };

  function render(programme) {
    if (!programme || !programme.sessions) {
      showError("data/programme.js loaded, but the programme object is missing.");
      return;
    }
    var hero = programme.hero || {};
    var about = programme.about || {};
    var contact = programme.contact || {};
    document.title = programme.festival + " " + programme.year;
    var description = document.querySelector('meta[name="description"]');
    if (description) description.setAttribute("content", hero.subtitle || programme.tagline || document.title);

    var brand = document.getElementById("brand");
    if (programme.logo) {
      brand.innerHTML = '<img src="' + escapeHtml(asset(programme.logo)) + '" alt="' + escapeHtml(programme.festival || "Music Meets Europe") + '">';
    } else {
      brand.textContent = programme.festival || "";
    }
    document.getElementById("nav").innerHTML = (programme.nav || []).map(function (item) {
      return '<li><a href="' + escapeHtml(item.href || "#") + '">' + escapeHtml(item.label || "") + "</a></li>";
    }).join("");

    var heroImage = document.getElementById("hero-image");
    if (hero.image) {
      heroImage.src = asset(hero.image);
      heroImage.alt = hero.imageAlt || programme.festival || "";
    } else {
      heroImage.removeAttribute("src");
      heroImage.alt = "";
    }
    if (hero.imagePosition && /^[a-z0-9%.\s-]+$/i.test(hero.imagePosition)) {
      heroImage.style.objectPosition = hero.imagePosition;
    }
    document.getElementById("hero-eyebrow").textContent = hero.eyebrow || "";
    document.getElementById("hero-title").textContent = [hero.titleLead, hero.titleEm].filter(Boolean).join(" ");
    var heroCredit = document.getElementById("hero-credit");
    var heroCreditHtml = creditHtml(hero.credit);
    heroCredit.innerHTML = heroCreditHtml;
    heroCredit.hidden = !heroCreditHtml;

    document.getElementById("intro-lead").textContent = hero.subtitle || [programme.tagline, programme.bond].filter(Boolean).join(" ");
    document.getElementById("facts").textContent = about.factsLine || ("Route · " + (programme.year || ""));

    var aboutMedia = document.getElementById("about-media");
    if (about.video) {
      aboutMedia.innerHTML = '<video class="about-video" autoplay muted loop playsinline src="' + escapeHtml(asset(about.video)) + '"></video>';
    } else {
      aboutMedia.innerHTML = "";
    }
    document.getElementById("about-label").textContent = about.label || "";
    document.getElementById("about-title").innerHTML = rich(about.title || "");
    document.getElementById("about-paragraphs").innerHTML = (about.paragraphs || []).map(function (paragraph) {
      return "<p>" + escapeHtml(paragraph) + "</p>";
    }).join("");

    var sessionsIntro = programme.sessionsIntro || {};
    document.getElementById("sessions-eyebrow").textContent = sessionsIntro.eyebrow || "";
    document.getElementById("sessions-title").innerHTML = rich(sessionsIntro.title || "");
    document.getElementById("sessions-grid").innerHTML = (programme.sessions || []).map(function (session) {
      var places = (session.cities || []).map(function (city) {
        return escapeHtml(city.name || "");
      }).filter(Boolean).join(" · ");
      var points = (session.highlights || []).map(function (line) {
        return "<li>" + escapeHtml(line) + "</li>";
      }).join("");
      var label = session.enquireLabel || programme.enquireLabel || "Enquire";
      var media = session.image
        ? '<img src="' + escapeHtml(asset(session.image)) + '" alt="' + escapeHtml(session.imageAlt || "") + '">'
        : "";
      return '<article class="teaser">' + media +
        '<p class="teaser-kicker">' + escapeHtml(session.tag || "") + "</p>" +
        '<h3 class="place-names">' + places + "</h3>" +
        '<p class="teaser-meta">' + escapeHtml(session.dateLabel || "") + "</p>" +
        (session.description ? '<p class="teaser-text">' + escapeHtml(session.description) + "</p>" : "") +
        (points ? '<ul class="teaser-points">' + points + "</ul>" : "") +
        '<a class="more" href="' + escapeHtml(enquiryHref(programme, label)) + '">' + escapeHtml(label) + " →</a>" +
        creditHtml(session.credit || creditFor(session.image, programme)) +
        "</article>";
    }).join("");

    var eventsIntro = programme.eventsIntro || {};
    document.getElementById("events-eyebrow").textContent = eventsIntro.eyebrow || "";
    document.getElementById("events-title").innerHTML = rich(eventsIntro.title || "");
    var halls = [];
    var pending = [];
    (programme.events || []).forEach(function (event) {
      if (event.image) halls.push(event);
      else pending.push(event);
    });
    var enquire = programme.enquireLabel || "Enquire";
    document.getElementById("events-grid").innerHTML = halls.map(function (event) {
      var photos = '<img src="' + escapeHtml(asset(event.image)) + '" alt="' + escapeHtml(event.imageAlt || event.title || "") + '">';
      return '<article class="teaser">' + photos +
        '<p class="teaser-kicker">' + rich(event.when || "") + "</p>" +
        '<h3>' + escapeHtml(event.title || "") + "</h3>" +
        '<p class="teaser-meta">' + escapeHtml(event.location || "") + "</p>" +
        (event.description ? '<p class="teaser-text">' + escapeHtml(event.description) + "</p>" : "") +
        '<a class="more" href="' + escapeHtml(enquiryHref(programme, event.title || enquire)) + '">' + escapeHtml(enquire) + " →</a>" +
        creditHtml(event.credit) +
        "</article>";
    }).join("");

    var pendingBlock = document.getElementById("pending-block");
    if (!pending.length) {
      pendingBlock.hidden = true;
      pendingBlock.innerHTML = "";
    } else {
      pendingBlock.hidden = false;
      pendingBlock.innerHTML =
        "<h3>" + escapeHtml(eventsIntro.pendingTitle || "Stops still to be confirmed") + "</h3>" +
        '<div class="pending-grid">' + pending.map(function (event) {
          return "<article><h4>" + escapeHtml(event.title || "") + "</h4>" +
            '<p class="teaser-meta">' + rich(event.when || "") + (event.location ? " · " + escapeHtml(event.location) : "") + "</p>" +
            (event.description ? "<p>" + escapeHtml(event.description) + "</p>" : "") +
            "</article>";
        }).join("") + "</div>";
    }

    var poster = programme.poster || {};
    document.getElementById("poster-eyebrow").textContent = poster.eyebrow || "";
    document.getElementById("poster-title").innerHTML = rich(poster.title || "");
    document.getElementById("poster-media").innerHTML = poster.image
      ? '<img src="' + escapeHtml(asset(poster.image)) + '" alt="' + escapeHtml(poster.alt || "") + '">'
      : "";

    document.getElementById("contact-title").innerHTML = rich(contact.title || "");
    document.getElementById("contact-sub").textContent = contact.text || "";
    document.getElementById("contact-email").innerHTML = programme.contactEmail
      ? '<a href="mailto:' + escapeHtml(programme.contactEmail) + '">' + escapeHtml(programme.contactEmail) + "</a>"
      : "";
    if (contact.messagePlaceholder) document.getElementById("message").placeholder = contact.messagePlaceholder;
    if (contact.submitLabel) document.getElementById("contact-submit").textContent = contact.submitLabel;

    document.getElementById("footer-logo").textContent = programme.festival || "";
    var links = (programme.nav || []).map(function (item) {
      return '<li><a href="' + escapeHtml(item.href || "#") + '">' + escapeHtml(item.label || "") + "</a></li>";
    });
    if (programme.contactEmail) {
      links.push('<li><a href="mailto:' + escapeHtml(programme.contactEmail) + '">' + escapeHtml(programme.contactEmail) + "</a></li>");
    }
    document.getElementById("footer-links").innerHTML = links.join("");
    document.getElementById("footer-mail").textContent = "";
    document.getElementById("footer-copy").textContent =
      "© " + (programme.year || "") + " " + (programme.festival || "Music Meets Europe") + ". All rights reserved.";

    document.getElementById("contact-form").addEventListener("submit", function (event) {
      event.preventDefault();
      window.location.href = window.MME_buildMailto(event.currentTarget);
    });
    sendHeight();
  }

  function sendHeight() {
    var height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "wix-iframe-height", height: height }, "*");
    }
  }
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  setInterval(sendHeight, 800);

  function boot() {
    if (window.MME_PROGRAMME) {
      render(window.MME_PROGRAMME);
      return;
    }
    if (window.MME_DATA_FAILED) {
      window.MME_ASSET_BASE = PAGES;
      var remote = document.createElement("script");
      remote.src = PAGES + "data/programme.js";
      remote.onload = function () {
        if (window.MME_PROGRAMME) render(window.MME_PROGRAMME);
        else showError("The programme file on GitHub Pages did not define MME_PROGRAMME.");
      };
      remote.onerror = function () {
        showError("The programme file could not be loaded. Embed https://uniartandreaszhang.github.io/musicmeeteurope/ in Wix, or keep data/programme.js beside index.html.");
      };
      document.head.appendChild(remote);
      return;
    }
    showError("data/programme.js could not be read. A missing comma or quote will do this. Restore the previous version, or compare the file with README.md.");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
